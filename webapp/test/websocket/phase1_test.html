<!DOCTYPE html>
<html>
<head>
    <title>OpenBD WebSocket Phase 1 Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: bold;
        }
        .status.disconnected {
            background: #ffebee;
            color: #c62828;
        }
        .status.connecting {
            background: #fff3e0;
            color: #e65100;
        }
        .status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .controls {
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            margin-right: 10px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #1976d2;
            color: white;
        }
        button:hover {
            background: #1565c0;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .message-input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            overflow-y: scroll;
            background: #f5f5f5;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 20px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #1976d2;
            background: white;
        }
        .log-entry.sent {
            border-left-color: #4caf50;
        }
        .log-entry.received {
            border-left-color: #2196f3;
        }
        .log-entry.error {
            border-left-color: #f44336;
            background: #ffebee;
        }
        .log-entry.system {
            border-left-color: #9e9e9e;
        }
        .timestamp {
            color: #666;
            font-size: 11px;
        }
        .stats {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        .stats div {
            display: inline-block;
            margin-right: 20px;
        }
        .stats label {
            font-weight: bold;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1>OpenBD WebSocket Phase 1 Test</h1>
    <p>This page tests the basic WebSocket connection, message echo, and connection lifecycle.</p>

    <div id="status" class="status disconnected">DISCONNECTED</div>

    <div class="controls">
        <button id="connectBtn" onclick="connect()">Connect</button>
        <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div class="stats">
        <div>
            <label>Connection ID:</label>
            <span id="connectionId">N/A</span>
        </div>
        <div>
            <label>Messages Sent:</label>
            <span id="messagesSent">0</span>
        </div>
        <div>
            <label>Messages Received:</label>
            <span id="messagesReceived">0</span>
        </div>
        <div>
            <label>Avg Latency:</label>
            <span id="avgLatency">N/A</span>
        </div>
    </div>

    <div style="margin: 20px 0;">
        <input type="text" id="messageInput" class="message-input"
               placeholder="Type a message and press Enter to send..."
               onkeypress="if(event.keyCode===13) sendMessage()">
        <button onclick="sendMessage()" style="margin-top: 10px;">Send Message</button>
        <button onclick="sendTestMessages()">Send 10 Test Messages</button>
    </div>

    <div class="log" id="log"></div>

    <script>
        let ws = null;
        let messagesSent = 0;
        let messagesReceived = 0;
        let connectionStartTime = 0;
        let latencies = [];

        // WebSocket URL - adjust port if needed
        const WS_URL = 'ws://localhost:8580/openbd/ws';

        function updateStatus(status, className) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = status;
            statusEl.className = 'status ' + className;
        }

        function log(message, type) {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;

            const timestamp = new Date().toISOString().substr(11, 12);
            entry.innerHTML = '<span class="timestamp">[' + timestamp + ']</span> ' + message;

            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateStats() {
            document.getElementById('messagesSent').textContent = messagesSent;
            document.getElementById('messagesReceived').textContent = messagesReceived;

            if (latencies.length > 0) {
                const avg = latencies.reduce((a, b) => a + b, 0) / latencies.length;
                document.getElementById('avgLatency').textContent = avg.toFixed(2) + 'ms';
            }
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('Already connected', 'system');
                return;
            }

            updateStatus('CONNECTING...', 'connecting');
            log('Connecting to ' + WS_URL + '...', 'system');

            ws = new WebSocket(WS_URL);

            ws.onopen = function(event) {
                connectionStartTime = Date.now();
                updateStatus('CONNECTED', 'connected');
                log('Connection established!', 'system');

                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
            };

            ws.onmessage = function(event) {
                messagesReceived++;
                const receiveTime = Date.now();

                log('Received: ' + event.data, 'received');

                // Calculate latency if this is an echo response
                if (event.data.startsWith('Echo: ')) {
                    const sentMessage = event.data.substring(6);
                    const match = sentMessage.match(/\[(\d+)\]$/);
                    if (match) {
                        const sentTime = parseInt(match[1]);
                        const latency = receiveTime - sentTime;
                        latencies.push(latency);
                        log('Round-trip latency: ' + latency + 'ms', 'system');
                    }
                }

                updateStats();
            };

            ws.onerror = function(error) {
                log('WebSocket error: ' + error, 'error');
                console.error('WebSocket error:', error);
            };

            ws.onclose = function(event) {
                updateStatus('DISCONNECTED', 'disconnected');
                log('Connection closed. Code: ' + event.code + ', Reason: ' + (event.reason || 'None'), 'system');

                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;

                ws = null;
            };
        }

        function disconnect() {
            if (ws) {
                log('Closing connection...', 'system');
                ws.close();
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) {
                log('Cannot send empty message', 'error');
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected. Please connect first.', 'error');
                return;
            }

            // Append timestamp for latency measurement
            const messageWithTime = message + ' [' + Date.now() + ']';

            try {
                ws.send(messageWithTime);
                messagesSent++;
                log('Sent: ' + messageWithTime, 'sent');
                updateStats();

                input.value = '';
            } catch (error) {
                log('Error sending message: ' + error, 'error');
            }
        }

        function sendTestMessages() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected. Please connect first.', 'error');
                return;
            }

            log('Sending 10 test messages...', 'system');

            for (let i = 1; i <= 10; i++) {
                setTimeout(function() {
                    const message = 'Test message ' + i + ' [' + Date.now() + ']';
                    ws.send(message);
                    messagesSent++;
                    log('Sent: ' + message, 'sent');
                    updateStats();
                }, i * 100); // 100ms delay between messages
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            log('Log cleared', 'system');
        }

        // Auto-connect on page load (optional)
        // connect();
    </script>
</body>
</html>
